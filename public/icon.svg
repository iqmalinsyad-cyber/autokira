<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#090b10" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7700" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas (Maskable safe zone compliant) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6" />

  <!-- Outer Speedometer / Turbo Arc Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#222a3a" stroke-width="24" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="180" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#orangeGrad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="360" filter="url(#glow)" />

  <!-- Center Vehicle & Calculator Emblem -->
  <!-- Car Silhouette -->
  <path d="M160 270 L195 195 C203 178, 222 168, 240 168 L272 168 C290 168, 309 178, 317 195 L352 270 C364 274, 372 286, 372 300 L372 344 C372 355, 363 364, 352 364 L340 364 C329 364, 320 355, 320 344 L320 334 L192 334 L192 344 C192 355, 183 364, 172 364 L160 364 C149 364, 140 355, 140 344 L140 300 C140 286, 148 274, 160 270 Z" fill="url(#orangeGrad)" />
  
  <!-- Windshield -->
  <path d="M192 254 L212 204 C216 195, 226 190, 236 190 L276 190 C286 190, 296 195, 300 204 L320 254 Z" fill="#0c0e14" opacity="0.9" />

  <!-- Headlights (High Luminescence) -->
  <circle cx="178" cy="298" r="14" fill="#ffffff" filter="url(#glow)" />
  <circle cx="334" cy="298" r="14" fill="#ffffff" filter="url(#glow)" />

  <!-- Grille / Meter Lines -->
  <line x1="226" y1="304" x2="286" y2="304" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="234" y1="316" x2="278" y2="316" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- Dynamic Zap / Speed Accent -->
  <polygon points="266,120 236,160 258,160 246,192 284,148 262,148" fill="#ffcc00" filter="url(#glow)" />
</svg>
